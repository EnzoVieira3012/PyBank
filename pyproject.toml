[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
ignore = ["UP037"]  # quotes em forward refs SQLAlchemy (Mapped["User"]) sao intencionais

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true