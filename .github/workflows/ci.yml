name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy src

  test:
    name: Testes (Postgres 16 real)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pybank
          POSTGRES_PASSWORD: pybank
          POSTGRES_DB: pybank
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://pybank:pybank@localhost:5432/pybank
      SECRET_KEY: ${{ secrets.SECRET_KEY_TEST || 'ci-only-very-long-test-secret-key-32+chars' }}
      TEST_DATABASE_URL: postgresql+asyncpg://pybank:pybank@localhost:5432/pybank_test
      CORS_ORIGINS: '["http://localhost:3000"]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pip install "coverage<8"
      - name: Cria DB de teste
        run: |
          PGPASSWORD=pybank psql -h localhost -U pybank -d pybank -c "CREATE DATABASE pybank_test;"
        continue-on-error: true
      - name: Migra DB principal (saúde/duplicação)
        run: alembic upgrade head
      - name: Roda suite com cobertura
        run: python -m pytest -v --tb=short --cov-report=term-missing

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        run: docker build -t pybank:ci-${{ github.sha }} .
